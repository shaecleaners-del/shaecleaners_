Shae Cleaners Premium

:root{

gap:15px;

color:#fff;

box-shadow:0 5px 20px rgba(0,0,0,.15);

}

.back-btn{

width:42px;
height:42px;

display:flex;

align-items:center;
justify-content:center;

background:rgba(255,255,255,.2);

}

}

CHAT AREA

.bubble{

}

.message.admin .bubble{

background:#fff;

font-size:11px;

}

display:flex;

justify-content:center;

cursor:pointer;

font-size:18px;

transition:.3s;

}

.icon-btn{

background:#EEF4FF;

color:var(--primary);

}

#sendMessage{

background:linear-gradient(135deg,#0D6EFD,#38BDF8);

color:#fff;

}

.icon-btn:hover,
#sendMessage:hover{

transform:scale(1.08);

}

/*======================================
EMOJI PANEL
======================================*/

.emoji-panel{

display:flex;

flex-wrap:wrap;

gap:10px;

padding:15px;

background:#fff;

border-top:1px solid #E5E7EB;

}

.emoji{

width:42px;

background:#F1F5F9;

border-radius:12px;

cursor:pointer;

font-size:22px;

transition:.3s;

}

.emoji:hover{

transform:scale(1.1);

}

/*======================================
TYPING
======================================*/

.typing-status{

font-size:13px;

color:var(--grey);

font-style:italic;

}

/*======================================
OFFLINE INFO
======================================*/

.offline-info{

margin:12px;

background:#FEF3C7;

color:#92400E;

border-radius:14px;

}

/*======================================
QUICK CHAT

.quick-chat{

.quick-btn{

padding:10px 18px;

}

<script>/*=========================================
CHAT.JS
Shae Cleaners
=========================================*/

import { auth, db } from "./firebase.js";

import {
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";

import {
collection,
addDoc,
query,
where,
orderBy,
onSnapshot,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

const chatMessages = document.getElementById("chatMessages");
const messageInput = document.getElementById("messageInput");
const sendMessage = document.getElementById("sendMessage");

let currentUser = null;

/*=========================================
LOGIN
=========================================*/

onAuthStateChanged(auth, (user)=>{

    if(!user){

        window.location.href="login.html";
        return;

    }

    currentUser = user;

    loadMessages();

});

/*=========================================
KIRIM PESAN
=========================================*/

sendMessage.addEventListener("click", sendChat);

messageInput.addEventListener("keypress",(e)=>{

    if(e.key==="Enter"){

        sendChat();

    }

});

async function sendChat(){

    const text = messageInput.value.trim();

    if(text==="") return;

    try{

        await addDoc(
            collection(db,"chat"),
            {

                uid:currentUser.uid,
                sender:"user",
                message:text,
                createdAt:serverTimestamp(),
                read:false

            }
        );

        messageInput.value="";

    }catch(err){

        alert(err.message);

    }

}
/*=========================================
LOAD CHAT REALTIME
=========================================*/

function loadMessages(){

    const q = query(
        collection(db,"chat"),
        where("uid","==",currentUser.uid),
        orderBy("createdAt","asc")
    );

    onSnapshot(q,(snapshot)=>{

        chatMessages.innerHTML="";

        snapshot.forEach((docSnap)=>{

            const data=docSnap.data();

            const div=document.createElement("div");

            div.className=
            `message ${data.sender}`;

            div.innerHTML=`

                <div class="bubble">

                    ${data.message}

                </div>

                <span class="time">

                    ${formatTime(data.createdAt)}

                </span>

            `;

            chatMessages.appendChild(div);

        });

        scrollBottom();

    });

}


/*=========================================
FORMAT JAM
=========================================*/

function formatTime(timestamp){

    if(!timestamp) return "";

    const date=timestamp.toDate();

    return date.toLocaleTimeString("id-ID",{

        hour:"2-digit",
        minute:"2-digit"

    });

}


/*=========================================
AUTO SCROLL
=========================================*/

function scrollBottom(){

    chatMessages.scrollTop=
    chatMessages.scrollHeight;

}


/*=========================================
EMOJI
=========================================*/

document
.querySelectorAll(".emoji")
.forEach((emoji)=>{

emoji.addEventListener("click",()=>{

messageInput.value+=emoji.textContent;

messageInput.focus();

});

});


/*=========================================
QUICK CHAT
=========================================*/

document
.querySelectorAll(".quick-btn")
.forEach((btn)=>{

btn.addEventListener("click",()=>{

messageInput.value=
btn.dataset.message;

messageInput.focus();

});

});


/*=========================================
UPLOAD GAMBAR
=========================================*/

const imageInput=
document.getElementById("imageInput");

imageInput.addEventListener("change",(e)=>{

const file=e.target.files[0];

if(!file) return;

alert(
"Upload gambar akan diaktifkan setelah Firebase Storage dikonfigurasi."
);

});


/*=========================================
UPLOAD DOKUMEN
=========================================*/

const fileInput=
document.getElementById("fileInput");

fileInput.addEventListener("change",(e)=>{

const file=e.target.files[0];

if(!file) return;

alert(
"Upload dokumen akan diaktifkan setelah Firebase Storage dikonfigurasi."
);

});


/*=========================================
STATUS ADMIN
=========================================*/

const adminStatus=
document.getElementById("adminStatus");

adminStatus.textContent=
"ðŸŸ¢ Online";


/*=========================================
READY
=========================================*/

console.log(
"Live Chat Ready - Shae Cleaners"
);</script>
<script>
/*=========================================
 SHAE CLEANERS FIREBASE
=========================================*/

import { db, storage } from "./firebase-config.js";

import {

collection,
addDoc,
getDocs,
doc,
updateDoc,
deleteDoc,
query,
orderBy,
onSnapshot

} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

import {

ref,
uploadBytes,
getDownloadURL

} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-storage.js";

/*=========================================
 SIMPAN ORDER
=========================================*/

export async function simpanOrder(data){

try{

const hasil = await addDoc(

collection(db,"orders"),

{

...data,

createdAt:new Date()

}

);

return hasil.id;

}catch(err){

console.error(err);

alert("Gagal menyimpan order.");

}

}

/*=========================================
 AMBIL SEMUA ORDER
=========================================*/

export async function ambilOrder(){

const daftar=[];

const q=query(

collection(db,"orders"),

orderBy("createdAt","desc")

);

const snap=await getDocs(q);

snap.forEach(docItem=>{

daftar.push({

id:docItem.id,

...docItem.data()

});

});

return daftar;

}

/*=========================================
 REALTIME ORDER
=========================================*/

export function realtimeOrder(callback){

const q=query(

collection(db,"orders"),

orderBy("createdAt","desc")

);

return onSnapshot(q,(snapshot)=>{

const data=[];

snapshot.forEach(item=>{

data.push({

id:item.id,

...item.data()

});

});

callback(data);

});

}

/*=========================================
 UPDATE STATUS
=========================================*/

export async function updateStatus(id,status){

await updateDoc(

doc(db,"orders",id),

{

status:status

}

);

}

/*=========================================
 HAPUS ORDER
=========================================*/

export async function hapusOrder(id){

await deleteDoc(

doc(db,"orders",id)

);

}

/*=========================================
 UPLOAD FOTO
=========================================*/

export async function uploadFoto(file){

const namaFile=

Date.now()+"_"+file.name;

const storageRef=

ref(storage,"order/"+namaFile);

await uploadBytes(storageRef,file);

const url=

await getDownloadURL(storageRef);

return url;

}

/*=========================================
 GENERATE INVOICE
=========================================*/

export function generateInvoice(){

const d=new Date();

return "INV-"+

d.getFullYear()+

String(d.getMonth()+1).padStart(2,"0")+

String(d.getDate()).padStart(2,"0")+

"-"+

Math.floor(Math.random()*900+100);

}

console.log("Firebase Shae Cleaners siap digunakan.");
export async function uploadBukti(file){

const storageRef = ref(

storage,

"payment/"+Date.now()+"_"+file.name

);

await uploadBytes(storageRef,file);

return await getDownloadURL(storageRef);

}</script>
